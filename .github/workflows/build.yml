name: Build firmware

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arm GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Build bootloader
        run: |
          cmake -B build/bootloader -G Ninja -DCMAKE_BUILD_TYPE=Debug stm32/b2_bootloader
          cmake --build build/bootloader

      - name: Build app (slot A)
        run: |
          cmake -B build/slot_a -G Ninja -DLINKER_SCRIPT=slot_a.ld -DCMAKE_BUILD_TYPE=Debug stm32/b2_app
          cmake --build build/slot_a

      - name: Verify slot A vector table
        run: |
          VECTOR=$(xxd -s 4 -l 4 -e -g 4 build/slot_a/b2_app.bin | awk '{print $2}')
          echo "Slot A reset vector: 0x$VECTOR"
          case "$VECTOR" in
            0802*) echo "OK" ;;
            *) echo "FAIL: expected 0x0802xxxx"; exit 1 ;;
          esac

      - name: Build app (slot B)
        run: |
          cmake -B build/slot_b -G Ninja -DLINKER_SCRIPT=slot_b.ld -DCMAKE_BUILD_TYPE=Debug stm32/b2_app
          cmake --build build/slot_b

      - name: Verify slot B vector table
        run: |
          VECTOR=$(xxd -s 4 -l 4 -e -g 4 build/slot_b/b2_app.bin | awk '{print $2}')
          echo "Slot B reset vector: 0x$VECTOR"
          case "$VECTOR" in
            0804*) echo "OK" ;;
            *) echo "FAIL: expected 0x0804xxxx"; exit 1 ;;
          esac

      - name: Stage artifacts
        run: |
          mkdir -p out
          cp build/bootloader/b2_bootloader.bin out/
          cp build/slot_a/b2_app.bin out/app_slot_a.bin
          cp build/slot_b/b2_app.bin out/app_slot_b.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*